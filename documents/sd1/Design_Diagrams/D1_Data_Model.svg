<svg xmlns="http://www.w3.org/2000/svg" width="620" height="455" viewBox="0 0 620 455">
  <rect x="0" y="0" width="620" height="455" fill="#ffffff"/>
  <text x="12" y="20" font-family="Helvetica" font-size="14" font-weight="bold" fill="#000000">Figure 1. C5 Hub: relational data model</text>
  <text x="12" y="39" font-family="Helvetica" font-size="11" fill="#000000">Target D1 schema. PK = primary key; FK = foreign key.</text>
  <line x1="257" y1="99" x2="362" y2="99" stroke="#000000" stroke-width="1.5"/>
  <line x1="130" y1="152" x2="130" y2="232" stroke="#000000" stroke-width="1.5"/>
  <line x1="485" y1="152" x2="485" y2="232" stroke="#000000" stroke-width="1.5"/>
  <line x1="257" y1="328" x2="362" y2="328" stroke="#000000" stroke-width="1.5"/>
  <text x="269" y="88" font-family="Helvetica" font-size="12" fill="#000000">1</text>
  <text x="326" y="88" font-family="Helvetica" font-size="12" fill="#000000">0..*</text>
  <text x="146" y="173" font-family="Helvetica" font-size="12" fill="#000000">1</text>
  <text x="146" y="218" font-family="Helvetica" font-size="12" fill="#000000">0..*</text>
  <text x="501" y="173" font-family="Helvetica" font-size="12" fill="#000000">1</text>
  <text x="501" y="218" font-family="Helvetica" font-size="12" fill="#000000">0..*</text>
  <text x="269" y="317" font-family="Helvetica" font-size="12" fill="#000000">1</text>
  <text x="324" y="317" font-family="Helvetica" font-size="12" fill="#000000">1..*</text>
  <rect x="12" y="57" width="245" height="95" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="362" y="57" width="245" height="95" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="12" y="232" width="245" height="195" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="362" y="232" width="245" height="195" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="26" y="79" font-family="Helvetica" font-size="13" font-weight="bold" fill="#000000">Origin</text>
  <text x="26" y="102" font-family="Helvetica" font-size="11" fill="#000000">PK origin_id: TEXT</text>
  <text x="26" y="123" font-family="Helvetica" font-size="11" fill="#000000">expected_sender: BLOB[16]</text>
  <text x="376" y="79" font-family="Helvetica" font-size="13" font-weight="bold" fill="#000000">Sensor</text>
  <text x="376" y="102" font-family="Helvetica" font-size="11" fill="#000000">PK, FK origin_id: TEXT</text>
  <text x="376" y="123" font-family="Helvetica" font-size="11" fill="#000000">PK sensor_id: TEXT</text>
  <text x="26" y="254" font-family="Helvetica" font-size="13" font-weight="bold" fill="#000000">Envelope</text>
  <text x="26" y="277" font-family="Helvetica" font-size="11" fill="#000000">PK, FK origin_id: TEXT</text>
  <text x="26" y="297" font-family="Helvetica" font-size="11" fill="#000000">PK message_id: TEXT</text>
  <text x="26" y="317" font-family="Helvetica" font-size="11" fill="#000000">envelope_version: INTEGER</text>
  <text x="26" y="337" font-family="Helvetica" font-size="11" fill="#000000">collected_at_ms: INTEGER</text>
  <text x="26" y="357" font-family="Helvetica" font-size="11" fill="#000000">received_at_ms: INTEGER</text>
  <text x="26" y="377" font-family="Helvetica" font-size="11" fill="#000000">authenticated_sender: BLOB[16]</text>
  <text x="26" y="397" font-family="Helvetica" font-size="11" fill="#000000">envelope_bytes: BLOB</text>
  <text x="376" y="254" font-family="Helvetica" font-size="13" font-weight="bold" fill="#000000">Reading</text>
  <text x="376" y="277" font-family="Helvetica" font-size="11" fill="#000000">PK, FK origin_id: TEXT</text>
  <text x="376" y="297" font-family="Helvetica" font-size="11" fill="#000000">PK, FK message_id: TEXT</text>
  <text x="376" y="317" font-family="Helvetica" font-size="11" fill="#000000">PK, FK sensor_id: TEXT</text>
  <text x="376" y="337" font-family="Helvetica" font-size="11" fill="#000000">encoding: TEXT</text>
  <text x="376" y="357" font-family="Helvetica" font-size="11" fill="#000000">payload: BLOB</text>
  <text x="376" y="385" font-family="Helvetica" font-size="10" fill="#000000">FK (origin_id, message_id): Envelope</text>
  <text x="376" y="403" font-family="Helvetica" font-size="10" fill="#000000">FK (origin_id, sensor_id): Sensor</text>
  <text x="12" y="447" font-family="Helvetica" font-size="10" fill="#000000">A2 enforces one or more Readings per Envelope in one transaction. Lines show relationships, not message flow.</text>
</svg>
